<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner subtle glow frame -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- Center translucent orb -->
  <circle cx="256" cy="256" r="160" fill="url(#circleGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

  <!-- Two Language Badges -->
  <!-- Left Badge: TH -->
  <g transform="translate(130, 160)">
    <rect x="-45" y="-30" width="90" height="54" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="3"/>
    <text x="0" y="7" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">ไทย</text>
  </g>

  <!-- Dual Exchange Arrow -->
  <g transform="translate(256, 155)" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-20 -6 L20 -6 M12 -14 L20 -6 L12 2" />
    <path d="M20 12 L-20 12 M-12 4 L-20 12 L-12 20" />
  </g>

  <!-- Right Badge: 中 -->
  <g transform="translate(382, 160)">
    <rect x="-45" y="-30" width="90" height="54" rx="16" fill="#4c0519" stroke="#fb7185" stroke-width="3"/>
    <text x="0" y="8" fill="#ffffff" font-family="'Noto Sans SC', system-ui, sans-serif" font-size="30" font-weight="bold" text-anchor="middle">中文</text>
  </g>

  <!-- Dynamic Soundwave and Microphone in Center Bottom -->
  <g transform="translate(256, 310)">
    <!-- Central Glowing Mic -->
    <rect x="-22" y="-40" width="44" height="68" rx="22" fill="#ffffff" />
    <!-- Mic grille details -->
    <line x1="-12" y1="-20" x2="12" y2="-20" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="-8" x2="12" y2="-8" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="4" x2="12" y2="4" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

    <!-- Mic Stand -->
    <path d="M-36 -8 C-36 28 36 28 36 -8" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="28" x2="0" y2="52" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="-24" y1="52" x2="24" y2="52" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <!-- Soundwave Waves (Left) -->
    <line x1="-60" y1="-10" x2="-60" y2="15" stroke="#fde047" stroke-width="5" stroke-linecap="round"/>
    <line x1="-75" y1="-22" x2="-75" y2="28" stroke="#fde047" stroke-width="5" stroke-linecap="round"/>
    <line x1="-90" y1="-5" x2="-90" y2="10" stroke="#fde047" stroke-width="5" stroke-linecap="round"/>

    <!-- Soundwave Waves (Right) -->
    <line x1="60" y1="-10" x2="60" y2="15" stroke="#fde047" stroke-width="5" stroke-linecap="round"/>
    <line x1="75" y1="-22" x2="75" y2="28" stroke="#fde047" stroke-width="5" stroke-linecap="round"/>
    <line x1="90" y1="-5" x2="90" y2="10" stroke="#fde047" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Bottom App Subtitle -->
  <text x="256" y="445" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="2" text-anchor="middle" opacity="0.9">REALTIME VOICE TRANSLATOR</text>
</svg>
